<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Equipe Solucao em Sistemas">
    <meta name="description"
        content="Site de agendamentos do lava rapido Papa Leguas, localzado na cidade de Piedade - SP">
    <meta name="keywords" content="agendamento, Papa Leguas, Lava Rapido">
    <title>Redefinição de senha</title>
    <link rel="icon" href="./images/icons/favicon.ico" type="image/png">
    <link rel="stylesheet" href="./styles/tokens.css">
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/components.css">
    <link rel="stylesheet" href="./styles/criarSenha.css">
    <script src="./javaScript/mascaras.js" defer></script>
    <script src="./javaScript/criarSenha.js" defer></script>
</head>

<body>
    <main>
        <section class="senha-card">
            <form id="form-senha" class="senha-form" data-destino="./login.html">
                <h2>Redefina a sua senha</h2>

                <div class="campo">
                    <label class="campo-label" for="senha">Nova Senha</label>
                    <input class="campo-input" type="password" id="senha" name="senha" autocomplete="new-password"
                        required>
                </div>

                <ul class="regras" aria-label="Requisitos da senha">
                    <li class="regra" id="regra-tamanho">Tenha no mínimo 8 caracteres</li>
                    <li class="regra" id="regra-letra-numero">Pelo menos uma letra e um número</li>
                    <li class="regra" id="regra-maiuscula-minuscula">Pelo menos uma letra maiúscula e uma minúscula</li>
                    <li class="regra" id="regra-especial">Pelo menos um caractere especial (#,$,@..)</li>
                </ul>

                <div class="campo">
                    <label class="campo-label" for="confirmar-senha">Confirme a senha</label>
                    <input class="campo-input" type="password" id="confirmar-senha" autocomplete="new-password"
                        required>
                </div>
                <p class="regra" id="regra-confirmar" hidden>As senhas são iguais</p>
                <label><input type="checkbox" id="mostrar-senha"> <p class="texto-mostrar-senha">Mostrar senha</p></label>

                <button class="botao botao-primario" id="botao-criar" type="submit" disabled>Redefinir senha</button>
            </form>
        </section>
    </main>
</body>

</html>
