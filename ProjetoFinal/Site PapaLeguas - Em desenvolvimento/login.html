<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Equipe Solucao em Sistemas">
    <meta name="description"
        content="Site de agendamentos do lava rapido Papa Leguas, localzado na cidade de Piedade - SP">
    <meta name="keywords" content="agendamento, Papa Leguas, Lava Rapido">
    <title>Login</title>
    <link rel="icon" href="./images/icons/favicon.ico" type="image/png">
    <link rel="stylesheet" href="./styles/tokens.css">
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/components.css">
    <link rel="stylesheet" href="./styles/login.css">
    <script src="./javaScript/mascaras.js" defer></script>
    <script src="./javaScript/login.js" defer></script>
</head>

<body>
    <main>
        <div class="card-login">
            <a class="interativos-login" href="./index.html">← Voltar</a>
            <section class="login-form">
                <div class="info-form">
                    <h2>Login</h2>

                    <form id="form-login" data-destino="./cliente/dashboardCli.html">
                        <div class="align-info">
                            <div class="campo">
                                <label class="campo-label" for="telefone">Número de telefone</label>
                                <input class="campo-input" type="tel" id="telefone" name="telefone"
                                    placeholder="(15) 12345-6789" autocomplete="tel" inputmode="tel" maxlength="15"
                                    pattern="\(\d{2}\) \d{5}-\d{4}" title="Use o formato (00) 12345-6789" required>
                            </div>

                            <div class="campo">
                                <label class="campo-label" for="senha">Senha</label>
                                <input class="campo-input" type="password" id="senha" name="senha"
                                    placeholder="•••••••••••" autocomplete="current-password" required>
                            </div>
                            <div class="info-senha">
                                <label><input type="checkbox" id="mostrar-senha"> <p class="texto-mostrar-senha">Mostrar senha</p></label>
                                <a class="interativos-login" href="./codigoVerif.html?origem=recuperacao">Esqueceu sua Senha?</a>
                            </div>
                        </div>
                        <p class="form-erro" id="erro-login" role="alert" hidden></p>
                        <button class="botao botao-primario" type="submit">Entrar</button>
                    </form>

                    <p>Não tem uma conta? <a class="interativos-login" href="./formCadastro.html">Clique aqui</a></p>
                    <a class="interativos-login" href="./loginAdmin.html">Sou administrador →</a>
                </div>
                <aside class="login-marca">
                    <img src="./images/logo.svg" alt="Papa-Léguas Lava Rápido">
                </aside>
            </section>
        </div>
    </main>
</body>

</html>
